name: CI/CD

on:
  push:
    branches: [master]

jobs:
  # Quality gate: lint, type-check, unit tests, and library build.
  # Both deploy-docs and release depend on this passing.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify dist output
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.umd.cjs || exit 1
          test -f dist/style.css || exit 1
          echo "All dist files present"

  # Build the VitePress docs and deploy to Cloudflare Pages.
  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run docs:build
        env:
          NODE_ENV: production

      # Self-provision the Pages project on first run only; on later runs it already
      # exists, so we skip creation cleanly instead of emitting an "already exists" error.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! bunx wrangler pages project list | grep -q 'vue-maplibre-gl'; then
            echo "Project not found — creating..."
            bunx wrangler pages project create vue-maplibre-gl --production-branch=master
          else
            echo "Project already exists — skipping creation."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=vue-maplibre-gl --branch=master

  # Tag + GitHub release when package.json version has no matching tag yet.
  # Depends only on test — a failed docs deploy must not block the release.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from package.json
        id: version
        run: echo "version=v$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Generate the new version's section from conventional commits and inject it
      # under the "# Changelog" title, preserving all curated history below.
      # Pushed with GITHUB_TOKEN so it does not re-trigger CI (plus [skip ci]).
      - name: Update changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          bunx git-cliff@latest --unreleased --tag "${{ steps.version.outputs.version }}" --config cliff.toml > /tmp/section.md
          if [ ! -s /tmp/section.md ]; then
            echo "No unreleased commits — skipping changelog update."
            exit 0
          fi
          awk 'NR==FNR{sec=sec $0 ORS; next} /^# Changelog/&&!d{print; print ""; printf "%s", sec; d=1; next} 1' \
            /tmp/section.md docs/changelog.md > /tmp/changelog.md
          mv /tmp/changelog.md docs/changelog.md
          if git diff --quiet docs/changelog.md; then
            echo "Changelog already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          git commit -m "📚docs(changelog): ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
